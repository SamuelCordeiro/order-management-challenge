name: Quality

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore and test backend
        run: |
          dotnet restore src/OrderManagement.sln
          dotnet build src/OrderManagement.sln --no-restore --configuration Release
          dotnet test src/OrderManagement.sln --no-build --configuration Release --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:coverage
          npm run build

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            TestResults/**/coverage.opencover.xml
            frontend/coverage/lcov.info
          if-no-files-found: error

  sonar:
    name: SonarQube Cloud
    needs: verify
    if: ${{ vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORGANIZATION != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports

      - name: Analyze with SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet restore src/OrderManagement.sln
          dotnet sonarscanner begin /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORGANIZATION" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" /d:sonar.javascript.lcov.reportPaths="**/lcov.info"
          dotnet build src/OrderManagement.sln --configuration Release --no-restore
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
